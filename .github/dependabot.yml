version: 2

updates:
  # The package itself is stdlib-only; the Actions pinned in
  # .github/workflows are what drifts. All minor/patch action updates
  # land in one grouped weekly PR instead of one PR each; majors stay
  # individual so a breaking action change gets its own review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # delay version updates N days after release: avoids yanked-release
    # haste, and satisfies the zizmor dependabot-cooldown audit
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
