name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs get read-only repo access by default.
permissions:
  contents: read

# One run per ref: a new push cancels the older in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: sync (with the pinned lockfile)
        run: uv sync --python ${{ matrix.python-version }}
      - name: unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: the console resolves and runs from the entry point
        # no scraped dataset in CI: it is fetched on demand (see README)
        run: uv run --no-sync opencode-rank --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: wheel + sdist build
        run: uv build
      - name: install the wheel into a throwaway tool env
        run: |
          uv tool install --force dist/*.whl
          opencode-rank --help >/dev/null

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents: read comes from the top level; the SARIF upload bundled
    # with the action needs security-events: write for the code-scanning
    # upload and actions: read to associate it with this workflow run.
    # Both are scoped to this job only.
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: audit workflows with zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
