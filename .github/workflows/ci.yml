name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: sync (with the pinned lockfile)
        run: uv sync --python ${{ matrix.python-version }}
      - name: unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: the console runs from the installed entry point
        run: uv run --no-sync opencode-rank list --source zen | head -4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: wheel + sdist build
        run: uv build
      - name: install the wheel into a throwaway tool env
        run: |
          uv tool install --force dist/*.whl
          opencode-rank --help >/dev/null
