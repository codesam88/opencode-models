name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs get read-only repo access by default.
permissions:
  contents: read

# One run per ref: a new push cancels the older in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: sync (with the pinned lockfile)
        run: uv sync --python ${{ matrix.python-version }}
      - name: unit tests
        run: uv run --no-sync python -m unittest discover -s tests -v
      - name: the console resolves and runs from the entry point
        # no scraped dataset in CI: it is fetched on demand (see README)
        run: uv run --no-sync opencode-models --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: wheel + sdist build
        run: uv build
      - name: install the wheel into a throwaway tool env
        run: |
          uv tool install --force dist/*.whl
          opencode-models --help >/dev/null

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: sync (with the pinned lockfile, dev tools included)
        run: uv sync --python "3.12"
      # same commands as `just lint`; ruff itself comes from the locked
      # dev group, never from the network at CI time beyond the lockfile
      - name: lint, format check and complexity gate
        run: |
          uv run --no-sync ruff check opencode_models tests
          uv run --no-sync ruff format --check opencode_models tests

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No SARIF upload: code scanning is not enabled for this repo, and
      # the upload is what kept failing — not the audit. The audit still
      # runs and fails this step on findings. If code scanning gets
      # enabled, drop this flag and add a job-level `permissions` block
      # with `security-events: write` (upload) plus `actions: read`
      # (run association).
      - name: audit workflows with zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
