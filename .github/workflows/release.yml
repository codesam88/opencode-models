name: release

on:
  push:
    tags:
      - "v*"

# Least privilege: checkout needs repo read access; publishing uses
# a short-lived OIDC token instead of a stored PyPI secret.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing (PyPI must list this repo as a trusted publisher first)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # no cache: releases are rare enough that a cold sync is cheap,
          # and it removes the cache-poisoning surface entirely
          enable-cache: false
      - name: check the tag matches the package version
        run: test "${GITHUB_REF#refs/tags/v}" = "$(grep -m1 '^version *=' pyproject.toml | cut -d'"' -f2)"
      - name: wheel + sdist build
        run: uv build
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Deliberately a separate job from `publish`, so the two grants cannot
  # overlap: a job-level `permissions` block *replaces* the workflow-level
  # one, so this job gets `contents: write` (enough to cut a Release) and
  # nothing else — no OIDC token — while `publish` keeps `id-token: write`
  # plus read-only repo access. Neither job can reach the other's grant,
  # and the workflow default above stays read-only for anything new.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only announce a release PyPI actually has
    needs: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both the token and the ref travel through `env`, never
      # interpolated into the script body. The body matches the releases
      # cut by hand before this job existed: an auto-generated PR list
      # plus the compare link.
      - name: create the GitHub Release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a Release; nothing to do"
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest
          fi
