[project]
name = "opencode-models"
version = "0.1.2"
description = "Ranked console of AI models: benchmark scores against real per-token prices"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "codesam", email = "tedsamhain@gmail.com" }]
keywords = ["llm", "benchmarks", "pricing", "ranking", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Utilities",
]
# The tool is stdlib-only on purpose: nothing to audit, patch or pin at
# runtime, and `uv tool install` has no dependency tree to resolve.
dependencies = []

[project.urls]
Homepage = "https://github.com/codesam88/opencode-models"
Repository = "https://github.com/codesam88/opencode-models"
Issues = "https://github.com/codesam88/opencode-models/issues"

[project.scripts]
opencode-models = "opencode_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["opencode_models"]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # errors, minus line-length (the formatter owns that)
    "F",               # pyflakes: unused imports/names, undefined names
    "W",               # trailing whitespace and friends
    "B",               # bugbear: likely bugs and design smells
    "UP",              # pyupgrade for the 3.10 floor
    "I",               # import sorting
    "C901",            # complexity ratchet (see max-complexity below)
]

[tool.ruff.lint.mccabe]
# Today's ceiling, not an aspiration: fail on anything more complex
# than the most complex function we already ship. Lower it when a
# refactor earns it, never raise it to silence the gate.
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
# One-letter loop vars are test-idiom, not production API shape.
"tests/*" = ["E741"]
